name: Z.ai Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Z.ai Code Review
        uses: tarmojussila/zai-code-review@v0.4.1
        with:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
